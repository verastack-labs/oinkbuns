<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#fff1d6" />
    <title>Play Oinkbuns - Bake hot cross buns with Peppa</title>
    <meta name="description" content="Play Oinkbuns free in your browser: bake, ice and serve hot cross buns with Peppa. Arrow keys and Space, or tap on a phone. No ads, no accounts." />
    <link rel="canonical" href="https://oinkbuns.verastack.dev/play/" />
    <link rel="icon" href="/art/logo.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oinkbuns" />
    <meta property="og:title" content="Play Oinkbuns - Bake hot cross buns with Peppa" />
    <meta property="og:description" content="A tiny, free kitchen game. Bake, ice and serve hot cross buns with Peppa." />
    <meta property="og:url" content="https://oinkbuns.verastack.dev/play/" />
    <meta property="og:image" content="https://oinkbuns.verastack.dev/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://oinkbuns.verastack.dev/og.png" />
    <style>
      /* #fff1d6 is the kitchen wall colour. The page behind the canvas shows
         through as the letterbox bars, so it must match the canvas
         background set in src/config.ts. */
      /* svh is the viewport with the browser toolbar showing, so it does not
         change when Android Chrome hides or shows its address bar while the
         page is touched. The game area keeps one size, and the spare strip is
         the same colour as the canvas background. */
      html,
      body {
        margin: 0;
        height: 100vh;
        height: 100svh;
        background: #fff1d6;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
        /* The custom pink arrow; tip at (3, 3). */
        cursor: url('assets/art/cursor.svg') 3 3, auto;
      }
      /* Spec 5.3: on a phone held upright, ask for landscape. CSS alone, so
         it appears before any script runs. */
      #rotate {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          position: fixed;
          inset: 0;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #fff1d6;
          color: #3a2a2a;
          font: bold 28px 'Fredoka', 'Segoe UI', sans-serif;
          text-align: center;
          padding: 24px;
        }
        #rotate .phone {
          width: 60px;
          height: 100px;
          border: 6px solid #3a2a2a;
          border-radius: 12px;
          animation: turn 1.6s ease-in-out infinite;
        }
      }
      @keyframes turn {
        0%, 30% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @font-face {
        font-family: 'Fredoka';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('fonts/Fredoka-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Fredoka';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('fonts/Fredoka-600.woff2') format('woff2');
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <noscript>Oinkbuns needs JavaScript to run. It is a free hot cross bun kitchen game; see <a href="/">oinkbuns.verastack.dev</a>.</noscript>
    <div id="rotate" aria-live="polite">
      <div class="phone"></div>
      <p>Turn your phone sideways to play!</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
