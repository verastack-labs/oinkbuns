<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#fff1d6" />
    <title>Oinkbuns</title>
    <style>
      /* #fff1d6 is the kitchen wall colour. The page behind the canvas shows
         through as the letterbox bars, so it must match the canvas
         background set in src/config.ts. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff1d6;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
        /* The custom pink arrow; tip at (3, 3). */
        cursor: url('assets/art/cursor.svg') 3 3, auto;
      }
      /* Spec 5.3: on a phone held upright, ask for landscape. CSS alone, so
         it appears before any script runs. */
      #rotate {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          position: fixed;
          inset: 0;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #fff1d6;
          color: #3a2a2a;
          font: bold 28px 'Fredoka', 'Segoe UI', sans-serif;
          text-align: center;
          padding: 24px;
        }
        #rotate .phone {
          width: 60px;
          height: 100px;
          border: 6px solid #3a2a2a;
          border-radius: 12px;
          animation: turn 1.6s ease-in-out infinite;
        }
      }
      @keyframes turn {
        0%, 30% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @font-face {
        font-family: 'Fredoka';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('fonts/Fredoka-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Fredoka';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('fonts/Fredoka-600.woff2') format('woff2');
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" aria-live="polite">
      <div class="phone"></div>
      <p>Turn your phone sideways to play!</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
