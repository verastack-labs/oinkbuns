<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#fff1d6" />
    <title>Oinkbuns</title>
    <style>
      /* #fff1d6 is the kitchen wall colour. The page behind the canvas shows
         through as the letterbox bars, so it must match the canvas
         background set in src/config.ts. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff1d6;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
